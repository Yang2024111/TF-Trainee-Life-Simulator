<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TF Trainee Life Simulator</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="phone-shell">
      <header class="status-bar">
        <span>20:27</span>
        <strong id="topTitle">主控选择</strong>
        <button id="phoneBtn" class="phone-shortcut hidden" type="button" title="手机信息">☎</button>
      </header>

      <section id="selectView" class="view active">
        <div class="select-title">
          <p>2023.01 - 2027.08</p>
          <h1>选择主控</h1>
          <span>本轮只可从 8 名练习生中选择一人，开始后不可切换。</span>
        </div>
        <div id="roster" class="roster"></div>
        <button id="startBtn" class="bottom-primary" type="button">开始养成</button>
      </section>

      <section id="eventView" class="view">
        <div class="month-card">
          <p id="monthText">2023 年 1 月</p>
          <h2 id="eventTitle">2023 新年音乐会「瞬间」</h2>
          <span id="eventType">本月事件</span>
        </div>
        <div class="scene-stage">
          <img id="eventImage" src="./assets/trainee-key-art.png" alt="本月事件图" />
        </div>
        <div class="dialogue-card">
          <strong id="speakerName">经纪老师</strong>
          <p id="eventDialogue">月初事件对话。</p>
        </div>
        <div id="stageFocusPanel" class="focus-panel"></div>
        <div id="eventChoices" class="choice-list"></div>
        <button id="skipEventBtn" class="ghost-btn" type="button">稍后处理，先去行动</button>
      </section>

      <section id="randomView" class="view">
        <div class="month-card">
          <p id="randomMonthText">月末结算</p>
          <h2>随机事件</h2>
          <span>本月所有成员都有概率触发事件</span>
        </div>
        <div id="randomMainList" class="event-list"></div>
        <button id="continueMonthBtn" class="bottom-primary" type="button">进入下个月</button>
      </section>

      <section id="actionView" class="view">
        <div class="hud-card">
          <div>
            <p id="actionMonth">2023 年 1 月</p>
            <h2 id="actionCount">本月第 1 / 3 次选择</h2>
          </div>
          <div class="mini-stats">
            <span id="miniFans">粉丝 0</span>
            <span id="miniRisk">风险 0</span>
          </div>
        </div>

        <div class="solo-stage">
          <img id="actionPortrait" alt="主控立绘" />
          <div class="name-plate">
            <strong id="leadName">主控</strong>
            <span id="leadTags">标签</span>
          </div>
        </div>

        <div class="action-tabs">
          <button class="mode-tab active" type="button" data-mode="train">训练</button>
          <button class="mode-tab" type="button" data-mode="chat">手机聊天</button>
        </div>
        <div id="actionOptions" class="action-options"></div>
      </section>

      <section id="phoneView" class="view">
        <div class="phone-head">
          <button id="backToGameBtn" class="ghost-btn" type="button">返回</button>
          <h2>手机</h2>
        </div>
        <div class="phone-tabs">
          <button class="info-tab active" type="button" data-info="feed">动态</button>
          <button class="info-tab" type="button" data-info="bubble">泡泡</button>
          <button class="info-tab" type="button" data-info="chat">聊天</button>
          <button class="info-tab" type="button" data-info="exam">考核</button>
          <button class="info-tab" type="button" data-info="stats">属性</button>
          <button class="info-tab" type="button" data-info="bag">背包</button>
          <button class="info-tab" type="button" data-info="rank">排名</button>
        </div>
        <div id="phoneContent" class="phone-content"></div>
      </section>

      <section id="resultView" class="view">
        <div class="select-title">
          <p>2027.08</p>
          <h1>破晓成团夜</h1>
          <span>最终按粉丝数排序，前 7 出道。</span>
        </div>
        <div id="finalList" class="rank-list"></div>
        <button id="restartBtn" class="bottom-primary" type="button">重新开始</button>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
